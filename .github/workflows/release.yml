name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.27"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: cross-compile and archive
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for os in linux darwin freebsd openbsd; do
            for arch in amd64 arm64; do
              # Archive is named per-platform; the binary inside is always
              # "spm" so `mise use github:kalw/spm` and manual extraction both
              # yield a plain `spm` on PATH.
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o spm ./cmd/spm
              tar -czf "dist/spm-${os}-${arch}.tar.gz" spm
              rm -f spm
            done
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
