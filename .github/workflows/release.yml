name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.27"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: cross-compile and archive
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for os in linux darwin freebsd openbsd; do
            for arch in amd64 arm64; do
              # Archive is named per-platform; the binary inside is always
              # "spm" so `mise use github:kalw/spm` and manual extraction both
              # yield a plain `spm` on PATH.
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o spm ./cmd/spm
              tar -czf "dist/spm-${os}-${arch}.tar.gz" spm
              rm -f spm
            done
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Rewrite the pinned install version in the README to this tag and commit it
  # back to the default branch, so the docs advertise a concrete version (never
  # a "latest" ref) and stay in sync with releases automatically.
  bump-docs:
    name: bump docs version
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: pin install version to ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"     # e.g. v0.1.2
          VER="${TAG#v}"               # e.g. 0.1.2  (mise pins without the leading v)
          # mise one-liner: github:kalw/spm@<VER>
          sed -i -E "s#(github:kalw/spm@)[0-9A-Za-z._-]+#\1${VER}#g" README.md
          # prebuilt curl block: VERSION=v<...>
          sed -i -E "s#^VERSION=v[0-9A-Za-z._-]+#VERSION=${TAG}#g" README.md
      - name: commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already up to date for ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # No [skip ci]: this commit is pushed with GITHUB_TOKEN (which already
          # does not trigger workflows), and a [skip ci] here would also skip the
          # Release when a future tag points at this commit.
          git commit -m "docs: pin install to ${GITHUB_REF_NAME}"
          git push origin main
